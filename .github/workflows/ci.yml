name: TeleMed AI Platform — CI/CD Pipeline

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Syntax & Core Import Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic python-dotenv pytest httpx

      - name: Run Backend Syntax Verification
        run: |
          python -m py_compile app/backend/main.py
          echo "FastAPI Backend Compilation Verified"

  frontend-build:
    name: Frontend Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Build Production Frontend
        working-directory: app/frontend
        run: npm run build
