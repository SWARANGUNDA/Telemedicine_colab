name: telemed

services:
  postgres:
    image: postgres:17-alpine
    container_name: telemed-postgres
    restart: always
    environment:
      POSTGRES_DB: telemed_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - telemed_postgres_data:/var/lib/postgresql/data
      - ../postgres/initdb:/docker-entrypoint-initdb.d
    networks:
      - telemed-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telemed_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: telemed-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - telemed_redis_data:/data
    networks:
      - telemed-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: app/backend/Dockerfile
    container_name: telemed-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ../../app/backend:/app/app/backend
      - ../../ai:/app/ai
      - ../../services:/app/services
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/telemed_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-telemed_enterprise_secret_key_production_2026_super_secure}
      JWT_SECRET: ${JWT_SECRET:-telemed_jwt_super_secret_key_phase_6_prod_2026}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - telemed-network

  celery-worker:
    build:
      context: ../..
      dockerfile: app/backend/Dockerfile
    container_name: telemed-celery-worker
    command: celery -A app.backend.celery_app worker --loglevel=info
    restart: always
    volumes:
      - ../../app/backend:/app/app/backend
      - ../../ai:/app/ai
      - ../../services:/app/services
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/telemed_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - telemed-network

volumes:
  telemed_postgres_data:
    name: telemed_postgres_data
  telemed_redis_data:
    name: telemed_redis_data

networks:
  telemed-network:
    name: telemed-network
    driver: bridge
