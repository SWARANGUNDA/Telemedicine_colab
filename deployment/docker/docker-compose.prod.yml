name: telemed-prod

services:
  postgres:
    image: postgres:17-alpine
    container_name: telemed-prod-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telemed_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - telemed_prod_postgres_data:/var/lib/postgresql/data
      - ../postgres/initdb:/docker-entrypoint-initdb.d
    networks:
      - telemed-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-telemed_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: telemed-prod-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - telemed_prod_redis_data:/data
    networks:
      - telemed-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: app/backend/Dockerfile
    container_name: telemed-prod-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-telemed_db}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:-telemed_prod_secret_key_2026_super_secure}
      JWT_SECRET: ${JWT_SECRET:-telemed_jwt_prod_secret_key_2026}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - telemed-prod-network

  celery-worker:
    build:
      context: ../..
      dockerfile: app/backend/Dockerfile
    container_name: telemed-prod-celery-worker
    command: celery -A app.backend.celery_app worker --loglevel=info
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-telemed_db}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - telemed-prod-network

  nginx:
    image: nginx:1.25-alpine
    container_name: telemed-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../app/frontend/dist:/usr/share/nginx/html:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - telemed-prod-network

volumes:
  telemed_prod_postgres_data:
    name: telemed_prod_postgres_data
  telemed_prod_redis_data:
    name: telemed_prod_redis_data

networks:
  telemed-prod-network:
    name: telemed-prod-network
    driver: bridge
